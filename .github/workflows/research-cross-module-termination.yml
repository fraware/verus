name: Experimental recursive decreases export

on:
  push:
    branches:
      - research/pinned-cross-module-termination-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vir-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - name: Compile VIR and run its own tests
        working-directory: source
        run: |
          set -euo pipefail
          cargo test -p vir --lib
